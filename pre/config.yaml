problem:
  # context: |
  #   Actualmente una empresa de envio de productos, necesita optimizar su enpaquetado de productos para minimizar la cantidad de cajas necesarias para enviar los productos a los clientes.
  # objective: |
  #   Minimizar la cantidad de cajas necesarias para empaquetar una cantidad de productos dada.
  # constraints: |
  #   - Cada producto debe estar en un paquete.
  #   - Un producto no debe estar en más de un paquete.
  #   - Cada paquete debe contener al menos un producto.
  context: |
    En este problema de empaquetado unidimensional, una empresa de envíos busca optimizar la forma en que distribuye una cantidad de productos en cajas, con el objetivo de minimizar el número total de cajas necesarias. 
    Cada producto tiene un tamaño definido, y todas las cajas poseen una capacidad máxima uniforme. 
    Se asume que la cantidad de cajas disponibles es infinita, por lo que el problema consiste en determinar cuántas cajas son necesarias y cómo asignar los productos a ellas de manera que ninguna caja exceda su capacidad.

  objective: |
    Minimizar la cantidad total de cajas necesarias para empaquetar todos los productos.

  constraints: |
    - Cada producto debe ser asignado exactamente a una caja.

    - La suma de los tamaños de los productos en una caja no puede exceder su capacidad.

    - Cada caja debe contener al menos un producto.
  
  instance-filename: "instance.txt"
  instance-format: |
    Para una instancia de 200 productos con paquetes de tamaño 100, tenemos la siquiente estructura:

    Primera parte de la representación
      100 200
    - El primer valor indica el tamaño de cada paquete, y el segundo indica el número total de paquetes. Luego, tenemos:

    Segunda parte de la representación
      42
      69
      67
      57
      93
      90
      38
      36
      45
      42
      ... 190
    - La segunda parte del archivo muestra el tamaño de cada paquete, en este caso, 200 valores

generation:
  first-generation-size: 5
  max-epochs: 5
  evolution-strategy: "individual" # "individual" | "cross"
  selection-strategy: "best-by-solution" # "best-by-solution" | "all-by-solution"
  timeout: 30 # seconds
  max-errors-resolved: 3 # max number of errors resolved in a single generation