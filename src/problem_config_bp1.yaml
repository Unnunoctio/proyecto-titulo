problem:
  context: |
    El problema abordado corresponde a la formulación unidimensional del \textit{Bin Packing Problem} (BPP). Sea un conjunto de productos \(N = \{1,2,\dots,n\}\), donde cada elemento \(i \in N\) posee un tamaño \(s_i \in \mathbb{R}^{+}\). Se dispone además de una cantidad ilimitada de contenedores (cajas) idénticos, cada uno con capacidad máxima fija \(C \in \mathbb{R}^{+}\).
    El objetivo consiste en determinar una asignación factible de productos a cajas, de modo que ninguna caja exceda su capacidad, y a la vez se minimice el número total de cajas utilizadas. La estructura combinatoria del BPP lo convierte en un problema NP-difícil, lo que implica que la búsqueda de soluciones óptimas para instancias de gran escala representa un desafío computacional significativo.
    Operativamente, el problema puede interpretarse como la construcción de subconjuntos de productos cuya suma de tamaños no exceda \(C\), donde cada subconjunto representa una caja. La tarea consiste entonces en encontrar una partición válida del conjunto de productos y, simultáneamente, optimizar la utilización del espacio disponible.

  objective: |
    Se consideran dos objetivos complementarios:
    \begin{itemize}
      \item \textbf{Minimizar la cantidad total de cajas utilizadas}:
      \[
        \min \sum_{j \in B} y_j,
      \]
      donde \(y_j = 1\) si la caja \(j\) es utilizada y \(0\) en caso contrario.

      \item \textbf{Minimizar el espacio desperdiciado}, o equivalentemente maximizar la utilización de la capacidad:
      \[
        \min \sum_{j \in B} \left( C - \sum_{i \in N} s_i x_{ij} \right),
      \]
      donde \(x_{ij} = 1\) si el producto \(i\) es asignado a la caja \(j\).
    \end{itemize}

  constraints: |
    La formulación considera las siguientes restricciones:
    \begin{itemize}
      \item \textbf{Asignación única de productos}:
      \[
        \sum_{j \in B} x_{ij} = 1 \quad \forall i \in N.
      \]

      \item \textbf{Restricción de capacidad}:
      \[
        \sum_{i \in N} s_i x_{ij} \le C \, y_j \quad \forall j \in B.
      \]

      \item \textbf{Consistencia en la apertura de cajas}:
      \[
        x_{ij} \le y_j \quad \forall i \in N,\ \forall j \in B.
      \]
    \end{itemize}
  
  instance-filename: "instances/instance-base-bp1.txt"
  instance-format: |
    Para una instancia de 200 productos con paquetes de tamaño 100, tenemos la siquiente estructura:

    Primera parte de la representación
      100 200
    - El primer valor indica el tamaño de cada paquete, y el segundo indica el número total de paquetes. Luego, tenemos:

    Segunda parte de la representación
      42
      69
      67
      57
      93
      90
      38
      36
      45
      42
      ... 190
    - La segunda parte del archivo muestra el tamaño de cada paquete, en este caso, 200 valores

