problem:
  context: |
    El Job Shop Problem es NP-hard. Existen \(n\) trabajos \(J=\{1,\dots,n\}\). Cada trabajo \(j\) consta de una secuencia ordenada de \(n_j\) operaciones indexadas por \(r=1,\dots,n_j\). La operación \(r\) del trabajo \(j\) se ejecuta en una máquina determinada \(o_{j,r}\in M\) y requiere un tiempo de procesamiento \(p_{j,r}>0\).

    Parámetros
    \begin{itemize}
      \item \(J=\{1,\dots,n\}\): conjunto de trabajos.
      \item \(M=\{1,\dots,m\}\): conjunto de máquinas.
      \item \(o_{j,r}\in M\): máquina que procesa la operación \(r\) del trabajo \(j\).
      \item \(p_{j,r}>0\): tiempo de procesamiento de la operación \(r\) del trabajo \(j\).
      \item \(A\) (o \(M\_big\)) : constante Big-M suficientemente grande (por ejemplo, la suma de todos los \(p_{j,r}\)).
    \end{itemize}

    Variables de decisión
    \begin{itemize}
      \item \(S_{j,r}\ge 0\): tiempo de inicio de la operación \(r\) del trabajo \(j\).
      \item \(y_{j,r,k,s}\in\{0,1\}\): variable binaria que vale 1 si la operación \((j,r)\) precede en la máquina a la operación \((k,s)\) (es decir, si en la misma máquina \((j,r)\) se programa antes que \((k,s)\)).
      \item \(C\ge 0\): makespan (tiempo máximo de finalización).
    \end{itemize}

  objective: |
    \min\ C

  constraints: |
    - Precedencia dentro de un trabajo (orden de operaciones del mismo trabajo):
      S_{j,r} \ge S_{j,r-1} + p_{j,r-1}\qquad \forall j\in J,\; r=2,\dots,n_j

    - Conflicto en máquinas (disyuntivas para operaciones que comparten la misma máquina): para cualquier par de operaciones \((j,r)\neq (k,s)\) tales que \(o_{j,r}=o_{k,s}\)
      S_{j,r} \ge S_{k,s} + p_{k,s} - A\cdot y_{j,r,k,s}
      S_{k,s} \ge S_{j,r} + p_{j,r} - A\cdot (1 - y_{j,r,k,s})

      Estas dos desigualdades obligan a que una de las operaciones comience después de que termine la otra.
    
    - Cálculo del makespan:
      C \ge S_{j,r} + p_{j,r}\qquad \forall j\in J,\; r=1,\dots,n_j.

    - Dominio
      S_{j,r} \ge 0,\quad C \ge 0,\quad y_{j,r,k,s}\in\{0,1\}.
  
  instance-filename: "instances/instance-base-jsp.txt"
  instance-format: |
    Each instance consists of a line of description, a line containing the 
    number of jobs and the number of machines, and then one line for each job,
    listing the machine number and processing time for each step of the job. 
    The machines are numbered starting with 0.

    Example:
    6 6
    2  1  0  3  1  6  3  7  5  3  4  6
    1  8  2  5  4 10  5 10  0 10  3  4
    2  5  3  4  5  8  0  9  1  1  4  7
    1  5  0  5  2  5  3  3  4  8  5  9 
    2  9  1  3  4  5  5  4  0  3  3  1
    1  3  3  3  5  9  0 10  4  4  2  1

generation:
  first-generation-size: 15
  max-epochs: 15
  evolution-strategy: "individual" # "individual" | "cross"
  selection-strategy: "best" # "best" | "random"
  timeout: 30 # seconds
  max-errors: 5 # max number of errors resolved in a single generation